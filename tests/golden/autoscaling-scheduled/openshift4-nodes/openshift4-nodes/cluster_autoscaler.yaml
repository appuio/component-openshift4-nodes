apiVersion: autoscaling.openshift.io/v1
kind: ClusterAutoscaler
metadata:
  annotations: {}
  labels:
    name: default
  name: default
spec:
  expanders:
    - Random
  logVerbosity: 1
  podPriorityThreshold: -10
  scaleDown:
    delayAfterAdd: 10m
    delayAfterDelete: 5m
    delayAfterFailure: 30s
    enabled: false
    unneededTime: 5m
    utilizationThreshold: '0.4'
